aid: kredivo
name: Kredivo
description: Kredivo is a Southeast Asian consumer credit platform operated by FinAccel (Kredivo Group), best
  known for its "Buy Now, Pay Later" product offering instant real-time credit decisioning for online and
  offline purchases across Indonesia, Vietnam, Thailand and the Philippines. For developers, Kredivo publishes
  the Kredivo Checkout API — a merchant-facing HTTP/JSON payment API that lets an ecommerce store, marketplace,
  POS or EDC terminal offer installment payment (30 days through 24 months) at checkout. The API covers 2-click
  redirect checkout, 0-click tokenized express checkout, dynamic and static QR checkout for physical stores, EDC
  terminal checkout, transaction status polling, full and partial cancellation, user credit-limit lookup, and an
  installment/interest calculator, with asynchronous push notifications to a merchant-supplied push_uri and a
  signature-key confirmation callback. Kredivo Group also operates KrediFazz (instant cash loans), Krom (digital
  bank), Timo and GajiGesa.
