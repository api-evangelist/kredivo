cross_cutting_rules:
  description: Rules every skill above restates because getting them wrong breaks the integration.
  rules:
  - HTTP 200 is not success — branch on the body `status` field (OK or ERROR), never the status code.
  - The credential (`server_key`) travels in the JSON request body, not a header.
  - The synchronous response is not the outcome — the result arrives asynchronously at `push_uri`.
  - Never fulfil on a push notification payload; verify with `confirmTransaction` first.
  - Fulfil only when `transaction_status` is `settlement`.
  - Always send an explicit `cancellation_id` on a cancellation.
  - No webhook retry policy is published, so reconcile unresolved orders by polling.
  - Never surface `fraud_status` or denial reasoning to the shopper.
