  schema: PaymentType
  identified_by: enum value
  relationships:
  - type: belongs_to
    target: Transaction
  - type: belongs_to
    target: CreditLimit
  - type: belongs_to
    target: PaymentOption
- name: PaymentOption
  description: |
    A priced installment option returned by the calculator — tenure, interest rate, service fee,
