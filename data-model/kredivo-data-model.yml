gaps:
- No identifier prefixing scheme, so ids are not self-describing.
- Merchant and SubMerchant are never returned as objects — they exist only as scalar fields.
- Cancellations are write-only; there is no operation to list or retrieve them.
- No operation lists transactions — every read requires a known order_id or transaction_id.
- The account_status and account_type integer vocabularies on CreditProfile are undocumented.
