api: Kredivo Checkout API
summary: |
  Entity-relationship graph derived from the $ref structure and id-reference fields of the
  transcribed OpenAPI. Kredivo's model is small and transaction-centric: a Transaction anchors
  everything, identified by two parallel keys — Kredivo's `transaction_id` and the merchant's
  `order_id` — and the only long-lived entity is the tokenized User.
identifiers:
  note: |
    Kredivo uses no prefixed or typed identifiers (no `txn_`/`cus_` style scheme). Ids are bare
    strings whose type must be inferred from the field name.
  keys:
  - field: transaction_id
    issued_by: Kredivo
    format: UUID (per every published example)
    example: bb0380d7-2688-4e73-a668-997f3fc5cbec
  - field: order_id
    issued_by: merchant
    format: opaque merchant string
    example: KB-0c40f395
    note: The merchant's natural key, echoed on every status and callback payload.
  - field: user_token
    issued_by: Kredivo
    format: opaque string
    note: Long-lived handle for a tokenized shopper. The only cross-transaction identifier.
  - field: client_user_key
    issued_by: merchant
    format: opaque merchant string (email in published examples)
    note: The merchant's own identifier for the shopper, paired with user_token at tokenization.
  - field: cancellation_id
    issued_by: merchant
    max_length: 60
    note: Idempotency key for a cancellation. One order_id may carry several.
  - field: sub_merchant_id
    issued_by: merchant
    note: Outlet / sub-merchant identifier, used by the offline (QR and EDC) surface.
  - field: terminal_id
    issued_by: merchant
    note: EDC device identifier.
  - field: signature_key
    issued_by: Kredivo
    note: Per-notification verification token, not an entity identifier.
entities:
- name: Merchant
  description: The integrating business, identified implicitly by its server_key.
  identified_by: server_key
  schema: null
  note: Never returned as an object — the merchant is only ever implied by the credential.
  relationships:
  - type: has_many
    target: Transaction
    via: server_key
  - type: has_many
    target: SubMerchant
    via: sub_merchant_id
- name: SubMerchant
  description: An outlet or store location within a merchant, used by QR and EDC checkout.
  identified_by: sub_merchant_id
  schema: null
  note: Not modelled as a schema — appears only as a scalar field on offline requests and callbacks.
  relationships:
  - type: belongs_to
    target: Merchant
  - type: has_many
    target: Transaction
    via: sub_merchant_id
- name: Transaction
  description: |
    The central entity. Created by a checkout operation, carried through an asynchronous push
    notification, and read back via confirmation or status polling.
  identified_by: transaction_id
  alternate_key: order_id
  schema: TransactionStatus
  states:
