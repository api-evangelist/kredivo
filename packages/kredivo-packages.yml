notes: |
  Kredivo does not publish first-party client libraries to npm, PyPI, Packagist, Maven Central,
  NuGet, pkg.go.dev, RubyGems or crates.io — all were probed on 2026-07-19 and returned no
  first-party package (the `kredivo` name on npm is an unrelated Next.js scaffold by a third party;
  PyPI and Packagist have no `kredivo` package). Kredivo also has no public GitHub organization.
  What Kredivo does ship first-party are downloadable ecommerce platform plugins, hosted on the
  documentation site. Those are captured below as the official integration surface; every download
  URL was verified 200 on 2026-07-19.
