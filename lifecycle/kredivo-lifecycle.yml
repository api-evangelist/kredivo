api: Kredivo Checkout API
summary: |
  Kredivo publishes a real, detailed Service Level Agreement and runs a public Atlassian Statuspage,
  which is more operational transparency than most BNPL providers in the region. What it does not
  publish is any versioning or deprecation policy — there is no announced version cadence, no
  sunset process, and no changelog. The operational posture is strong; the change-management posture
  is undocumented.
versioning:
  style: path segment
  policy_published: false
  current_versions:
  - version: v2
    path_prefix: /kredivo/v2/
    surface: online checkout, tokenization, cancellation, installment calculator
  - version: v1
    path_prefix: /offline/v1/
    surface: QR and EDC checkout
  unversioned_paths:
  - /kredivo/transaction/status
  notes: |
    Two independently versioned families plus one unversioned path, with no published relationship
    between them. No version header, no media-type versioning, no documented negotiation. The
    existence of a v2 implies a v1 online surface once existed, but no v1-to-v2 migration guide is
    published.
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  notes: |
    No deprecation policy, no notice period, no Sunset or Deprecation response headers, and no
    documented retirement process. Note the curiosity that every published error example carries the
    literal `"kind": "deprecated"` in the error envelope — this appears to be an internal artifact
    of the error type rather than a deprecation signal, and is not explained in the docs.
changelog:
  published: false
  notes: |
    No dated changelog, release notes or version history is published for the Checkout API. Merchants
    have no documented way to learn that the API has changed other than direct contact with
    merchant operations.
