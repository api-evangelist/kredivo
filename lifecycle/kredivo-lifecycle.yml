sla:
  published: true
  source: https://doc.kredivo.com/
  scope: Kredivo Checkout
  hosting: Amazon EC2 and Amazon S3
  uptime_commitment:
    monthly_uptime_percentage: 99.9
    basis: commercially reasonable efforts, per calendar month
  exclusions_from_uptime_calculation:
  - name: Emergency Downtime
    definition: |
      Times where FinAccel becomes aware of a vulnerability which, based on a risk assessment,
      FinAccel deems to require immediate remediation, making Kredivo Checkout temporarily
      unavailable while it is addressed.
  - name: Scheduled Downtime
    definition: |
      Periods of server unavailability notified to the merchant three (3) days in advance. Capped at
      thirty (30) hours of Scheduled Downtime per calendar year.
  service_discount:
  - uptime_range: 99.9% to 97.0%
    remedy: 7 days discount from that month's billing
  - uptime_range: 97.0% to 95.0%
    remedy: 14 days discount from that month's billing
  - uptime_range: below 95.0%
    remedy: 30 days discount from that month's billing
  maximum_service_discount: |
    Aggregate maximum for a single calendar month shall not exceed thirty days of billing.
  sla_exclusions: |
    The SLA does not apply to performance issues (i) caused by factors outside FinAccel's reasonable
    control including force majeure or internet access problems beyond the demarcation point of
    FinAccel servers; (ii) resulting from actions or inactions of the merchant; or (iii) arising from
    suspension or termination of the merchant's right to use Kredivo Checkout under the Kredivo
    Merchant Agreement.
  support_response_targets:
    office_hours: 09:00–18:30
    out_of_hours_note: |
      On weekends and public holidays, add another 30–60 minutes to both response and resolution
      times.
    severities:
    - severity: Critical
      definition: |
        Production server or other mission critical system(s) are down and no workaround is
        immediately available.
      examples:
      - Server down
      - Connection down
      - More than 15% of transactions are not processed by Kredivo due to technical issues
      response_time: 15 minutes
      resolution_time: 30 minutes
    - severity: Major
      definition: Major functionality is severely impaired.
      examples:
      - Intermittent connection
      - Less than 15% of transactions are not processed by Kredivo due to technical issues
      response_time: 30 minutes
      resolution_time: 60 minutes
    - severity: Minor
      definition: Partial, non-critical loss of functionality.
      examples:
      - Unable to access Kredivo Dashboard
      - Refund error
      - Missing merchant logo
      response_time: 30 minutes
      resolution_time: 120 minutes
