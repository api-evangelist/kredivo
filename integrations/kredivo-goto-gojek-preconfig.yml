arazzo: 1.0.1
info:
  title: 'kredivo through goto-gojek: charge preconfigured with kredivo'
  summary: Calls goto-gojek's charge with `kredivo` preset, the way kredivo is used inside goto-gojek.
  description: 'A PRECONFIGURATION, not an orchestration: kredivo is a rail inside goto-gojek, so the integration
    is goto-gojek''s own operation with kredivo''s enum value set. Derived from goto-gojek''s contract (goto-gojek-transactions-api-openapi.yml);
    required properties are inputs.'
  version: 1.0.0
x-integration:
  partner: goto-gojek
  relationship: rail
  preconfig: true
  edge_evidence: https://github.com/api-evangelist/goto-gojek/blob/main/openapi/goto-gojek-transactions-api-openapi.yml
  edge_type: contract
  preset:
    payment_type: kredivo
  method: derived
  generated: '2026-10-12'
  generator: build-integration-preconfigs.py
sourceDescriptions:
- name: gotoGojekTransactionsApiOpenapi
  url: https://raw.githubusercontent.com/api-evangelist/goto-gojek/refs/heads/main/openapi/goto-gojek-transactions-api-openapi.yml
  type: openapi
workflows:
- workflowId: kredivo-via-goto-gojek-charge
  summary: charge with kredivo preset
  inputs:
    type: object
    required:
    - transaction_details
    properties:
      transaction_details:
        type: string
  steps:
  - stepId: call-with-preset
    operationId: $sourceDescriptions.gotoGojekTransactionsApiOpenapi.charge
    requestBody:
      contentType: application/json
      payload:
        transaction_details: $inputs.transaction_details
        payment_type: kredivo
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      id: $response.body#/id
  outputs:
    id: $steps.call-with-preset.outputs.id
